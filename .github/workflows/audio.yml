name: Native audio

on:
  push:
    branches: [main]
    paths: ['audio-engine/**', 'ios/**', 'contracts/**', '.github/workflows/audio.yml']
  pull_request:
    branches: [main]
    paths: ['audio-engine/**', 'ios/**', 'contracts/**', '.github/workflows/audio.yml']

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test --locked --manifest-path audio-engine/Cargo.toml
      - run: cargo +stable clippy --locked --manifest-path audio-engine/Cargo.toml --all-targets -- -D warnings

  apple:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: command -v ffmpeg || brew install ffmpeg
      - run: audio-engine/scripts/build-apple.sh
      - run: audio-engine/scripts/test-native.sh --apple
      - name: Select an available iPhone simulator
        run: python3 ios/scripts/select-test-simulator.py
      - name: Exercise the packaged bridge on iOS
        run: |
          xcrun simctl bootstatus "$PODCST_TEST_DEVICE" -b
          xcrun simctl spawn "$PODCST_TEST_DEVICE" "$PWD/audio-engine/target/native-tests/swift-simulator-$(uname -m)"
      - name: Test playback integration
        run: xcodebuild test -project ios/Podcst.xcodeproj -scheme PodcstTests -destination "platform=iOS Simulator,id=$PODCST_TEST_DEVICE" -derivedDataPath "$RUNNER_TEMP/podcst-audio-tests" CODE_SIGNING_ALLOWED=NO
