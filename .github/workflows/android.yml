name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'audio-engine/**', 'contracts/**', '.github/workflows/android.yml', '.github/actions/setup-android/**']
  pull_request:
    branches: [main]
    paths: ['android/**', 'audio-engine/**', 'contracts/**', '.github/workflows/android.yml', '.github/actions/setup-android/**']

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      - name: Contracts, model, network, bridge vectors and feature tests
        working-directory: android
        run: ./gradlew --console=plain :core:model:test :core:network:test testDebugUnitTest
      - name: Release build
        working-directory: android
        run: ./gradlew --console=plain :app:assembleRelease

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android
      - name: Instrumented audio tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew --console=plain :core:audio-engine:connectedDebugAndroidTest :core:playback:connectedDebugAndroidTest
