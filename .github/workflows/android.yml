name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'audio-engine/**', 'contracts/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', 'audio-engine/**', 'contracts/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.2" > /dev/null
      - name: Contracts, model, network, bridge vectors and feature tests
        working-directory: android
        run: ./gradlew --console=plain :core:model:test :core:network:test testDebugUnitTest
      - name: Release build
        working-directory: android
        run: ./gradlew --console=plain :app:assembleRelease

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.2" > /dev/null
      - name: Instrumented audio tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew --console=plain :core:audio-engine:connectedDebugAndroidTest :core:playback:connectedDebugAndroidTest
